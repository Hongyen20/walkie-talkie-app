name: Deploy Frontend (Flutter)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────── 1. Checkout ───────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────── 2. Setup Flutter ───────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # ─────────────────────────── 3. Install dependencies ───────────────────────────
      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      # ─────────────────────────── 4. Build web ───────────────────────────
      - name: Build Flutter Web
        working-directory: ./frontend
        run: flutter build web --release --base-href "/"

      # ─────────────────────────── 5. Clear old files on EC2 (FIX IMPORTANT) ───────────────────────────
      - name: Clear old frontend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Cleaning old frontend files..."
            sudo rm -rf ${{ secrets.EC2_FRONTEND_PATH }}/*

            echo "Fix permissions..."
            sudo chown -R ubuntu:ubuntu ${{ secrets.EC2_FRONTEND_PATH }}

      # ─────────────────────────── 6. Deploy new build ───────────────────────────
      - name: Deploy to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/build/web/*"
          target: ${{ secrets.EC2_FRONTEND_PATH }}
          strip_components: 3
          overwrite: true

      # ─────────────────────────── 7. Reload Nginx ───────────────────────────
      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Reloading nginx..."
            sudo systemctl reload nginx

            echo "Frontend deployed successfully!"